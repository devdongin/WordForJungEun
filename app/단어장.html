<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일본어 단어장</title>
<style>
:root {
  --bg: #f6f4ef; --card: #ffffff; --text: #22201c; --muted: #6f6a60; --line: #e3ded3;
  --accent: #c2410c; --accent-soft: #fdeee4;
  --new: #2563eb; --new-soft: #e6eefd;
  --learning: #b45309; --learning-soft: #fdf1dc;
  --review: #15803d; --review-soft: #e3f4e8;
  --suspended: #6b7280; --suspended-soft: #eceef1;
  --danger: #b91c1c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1917; --card: #24221f; --text: #ece8e1; --muted: #a39d92; --line: #3a3733;
    --accent: #fb923c; --accent-soft: #3b2718;
    --new: #7aa7ff; --new-soft: #1d2a44;
    --learning: #f5b44a; --learning-soft: #3a2d15;
    --review: #5fcf86; --review-soft: #183322;
    --suspended: #a1a7b0; --suspended-soft: #2e3036;
    --danger: #f87171;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  line-height: 1.5;
}
.jp { font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", "Noto Sans JP", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { max-width: 880px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 18px; margin-right: auto; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { border: 0; background: transparent; color: var(--muted); padding: 8px 12px; border-radius: 8px; font: inherit; cursor: pointer; }
nav button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
main { max-width: 880px; margin: 0 auto; padding: 20px 16px 60px; }
h2 { font-size: 18px; margin: 28px 0 12px; }
h2:first-child { margin-top: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat { border-radius: 12px; padding: 14px; border: 1px solid var(--line); background: var(--card); cursor: pointer; text-align: left; font: inherit; color: inherit; }
.stat:hover { border-color: var(--muted); }
.stat b { display: block; font-size: 28px; line-height: 1.1; }
.stat span { font-size: 13px; color: var(--muted); }
.stat small { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.b-new { color: var(--new); background: var(--new-soft); }
.b-learning { color: var(--learning); background: var(--learning-soft); }
.b-review { color: var(--review); background: var(--review-soft); }
.b-suspended { color: var(--suspended); background: var(--suspended-soft); }
.stat.s-new b { color: var(--new); } .stat.s-learning b { color: var(--learning); }
.stat.s-review b { color: var(--review); } .stat.s-suspended b { color: var(--suspended); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--muted); font-size: 14px; }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 8px 14px; border-radius: 8px; font: inherit; cursor: pointer; display: inline-block; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
input, select, textarea { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
textarea { width: 100%; min-height: 140px; }
label.field { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
.list { display: grid; gap: 8px; }
.word { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; }
@media (max-width: 560px) { .word { grid-template-columns: 1fr; } .word .side { justify-items: start !important; } .word .side .row { justify-content: flex-start !important; } }
.word .head { font-size: 20px; }
.word .reading { color: var(--muted); font-size: 14px; margin-left: 6px; }
.word .mean { font-size: 15px; }
.word .ex { font-size: 13px; color: var(--muted); }
.word .side { display: grid; gap: 6px; justify-items: end; }
.tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
.queue { counter-reset: q; display: grid; gap: 6px; padding: 0; margin: 0; list-style: none; }
.queue li { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.queue li::before { counter-increment: q; content: counter(q); color: var(--muted); font-size: 12px; width: 18px; text-align: right; }
.notice { padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); font-size: 14px; overflow-wrap: anywhere; }
.notice.err { color: var(--danger); }
table.preview { width: 100%; border-collapse: collapse; font-size: 14px; }
table.preview th, table.preview td { border-bottom: 1px solid var(--line); padding: 6px; text-align: left; vertical-align: top; }
.scroll { overflow-x: auto; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
#toast.show { opacity: 1; }
.hero { display: flex; align-items: flex-end; gap: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 20px 0; margin-bottom: 20px; overflow: hidden; }
.hero img { width: 120px; height: auto; display: block; flex-shrink: 0; }
.hero .msg { padding-bottom: 20px; word-break: keep-all; }
.hero .msg b { display: block; font-size: 20px; margin-bottom: 4px; }
@media (max-width: 560px) { .hero img { width: 88px; } .hero .msg b { font-size: 17px; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span class="jp">単語帳</span> 일본어 단어장</div>
    <nav id="nav">
      <button data-view="home">홈</button>
      <button data-view="words">단어장</button>
      <button data-view="add">단어 추가</button>
      <button data-view="settings">설정</button>
    </nav>
  </div>
</header>
<main id="app"><p class="muted">불러오는 중…</p></main>
<div id="toast"></div>

// ---------- IndexedDB ----------
let dbPromise;
function openDb() {
  return dbPromise ||= new Promise((resolve, reject) => {
    const req = indexedDB.open('wordbook', 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      db.createObjectStore('words', { keyPath: 'id' });      // 단어 (저장소에서 받은 것 + 직접 추가)
      db.createObjectStore('progress', { keyPath: 'wordId' }); // 학습 상태
      db.createObjectStore('meta');                             // 설정, 동기화 정보
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const txDone = t => new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = t.onabort = () => rej(t.error); });
async function getAll(store) { const db = await openDb(); return reqP(db.transaction(store).objectStore(store).getAll()); }
async function getOne(store, key) { const db = await openDb(); return reqP(db.transaction(store).objectStore(store).get(key)); }
async function putMany(store, items) { const db = await openDb(); const t = db.transaction(store, 'readwrite'); const s = t.objectStore(store); items.forEach(i => s.put(i)); return txDone(t); }
async function delOne(store, key) { const db = await openDb(); const t = db.transaction(store, 'readwrite'); t.objectStore(store).delete(key); return txDone(t); }
async function getMeta(key, def) { const db = await openDb(); const v = await reqP(db.transaction('meta').objectStore('meta').get(key)); return v === undefined ? def : v; }
async function setMeta(key, val) { const db = await openDb(); const t = db.transaction('meta', 'readwrite'); t.objectStore('meta').put(val, key); return txDone(t); }
async function getSettings() { return { ...DEFAULT_SETTINGS, ...(await getMeta('settings', {})) }; }

// ---------- 유틸 ----------
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function fmtTime(ts) { if (!ts) return '없음'; return new Date(ts).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2600); }
const makeKey = (kanji, reading) => `${kanji || reading}-${reading}`;
const splitList = s => String(s || '').split(/[,/、，]/).map(x => x.trim()).filter(Boolean);
const isCustom = w => w.source === 'local' || w.file === 'custom.json';
const autoBase = () => location.protocol.startsWith('http') ? new URL('../words/', location.href).href : DEFAULT_REMOTE;
function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// 단어마다 하나씩 있는 학습 상태. status: new(새 단어) / learning(학습 중) / review(복습) / suspended(보류)
function newProgress(wordId) {
  return { wordId, status: 'new', prevStatus: null, interval: 0, due: null, streak: 0, lapses: 0, extraAnswers: [], createdAt: Date.now(), updatedAt: Date.now() };
}

function normalizeWord(raw, file) {
  const reading = String(raw.reading || '').trim();
  const meanings = Array.isArray(raw.meanings) ? raw.meanings.map(m => String(m).trim()).filter(Boolean) : splitList(raw.meanings);
  if (!reading || !meanings.length) return null;
  const kanji = String(raw.kanji || '').trim();
  return {
    id: raw.id || 'jp-' + makeKey(kanji, reading), kanji, reading, meanings,
    pos: raw.pos || '', example: raw.example && raw.example.jp ? raw.example : null,
    tags: Array.isArray(raw.tags) ? raw.tags : splitList(raw.tags),
    rank: Number.isFinite(raw.rank) ? raw.rank : 999999,
    source: raw.source || 'repo', file, removed: false, addedAt: Date.now(),
  };
}

// ---------- 동기화 ----------
async function wordsBase() {
  const s = await getSettings();
  if (s.remoteBase) return s.remoteBase.endsWith('/') ? s.remoteBase : s.remoteBase + '/';
  return autoBase();
}
async function fetchJson(url) {
  let res;
  try { res = await fetch(url, { cache: 'no-store' }); }
  catch { throw new Error('단어 저장소에 연결하지 못했습니다. 저장된 단어로 계속 사용할 수 있어요.'); }
  if (res.status === 404) throw new Error(`단어 파일을 찾지 못했습니다. GitHub에 push 했는지 확인하세요. (${url})`);
  if (!res.ok) throw new Error(`단어를 받지 못했습니다. (HTTP ${res.status})`);
  return res.json();
}

async function sync({ force = false } = {}) {
  const base = await wordsBase();
  const index = await fetchJson(base + 'index.json');
  const versions = force ? {} : await getMeta('fileVersions', {});
  const words = await getAll('words');
  const progressIds = new Set((await getAll('progress')).map(p => p.wordId));
  const byId = new Map(words.map(w => [w.id, w]));
  const puts = new Map(), newProg = [];
  const indexPaths = new Set(index.files.map(f => f.path));
  const fetchedPaths = new Set(), freshIds = new Set();
  let added = 0, invalid = 0;

  for (const f of index.files) {
    if (versions[f.path] === f.version) continue; // 버전이 같으면 다시 받지 않음
    const list = await fetchJson(base + f.path);
    fetchedPaths.add(f.path);
    for (const raw of list) {
      const w = normalizeWord(raw, f.path);
      if (!w) { invalid++; continue; }
      const old = byId.get(w.id);
      if (!old || old.removed) added++;
      if (old) w.addedAt = old.addedAt;
      freshIds.add(w.id);
      puts.set(w.id, w);
      // 진도는 id 기준으로 유지. 처음 보는 단어만 "새 단어"로 등록
      if (!progressIds.has(w.id)) { newProg.push(newProgress(w.id)); progressIds.add(w.id); }
    }
    versions[f.path] = f.version;
  }

  // 저장소에서 사라진 단어는 숨김 (진도는 남겨둠)
  let removed = 0;
  for (const w of words) {
    if (w.source === 'local' || w.removed || freshIds.has(w.id)) continue;
    if (fetchedPaths.has(w.file) || !indexPaths.has(w.file)) { puts.set(w.id, { ...w, removed: true }); removed++; }
  }
  for (const p of Object.keys(versions)) if (!indexPaths.has(p)) delete versions[p];

  await putMany('words', [...puts.values()]);
  await putMany('progress', newProg);
  await setMeta('fileVersions', versions);
  await setMeta('lastSync', Date.now());
  return { added, removed, invalid, files: fetchedPaths.size };
}

// ---------- 데이터 모으기 ----------
async function loadAll() {
  const [words, progress] = await Promise.all([getAll('words'), getAll('progress')]);
  const prog = new Map(progress.map(p => [p.wordId, p]));
  return words.filter(w => !w.removed).map(w => ({ ...w, p: prog.get(w.id) || newProgress(w.id) }));
}
// 새 단어 투입 순서: 직접 추가한 단어 먼저, 그다음 목록 순위
function newQueue(words) {
  return words.filter(w => w.p.status === 'new').sort((a, b) =>
    (isCustom(b) - isCustom(a)) || (a.rank - b.rank) || (a.addedAt - b.addedAt));
}
function countStatus(words) {
  const today = todayStr();
  const c = { new: 0, learning: 0, review: 0, suspended: 0, due: 0 };
  for (const w of words) {
    c[w.p.status]++;
    if (w.p.status === 'review' && w.p.due && w.p.due <= today) c.due++;
  }
  return c;
}

  $('#app').innerHTML = html;
  if (state.view === 'words') bindWordFilters();

function go(view, patch) { state.view = view; if (patch) Object.assign(state.filter, patch); window.scrollTo(0, 0); return render(); }

const tagsHtml = w => (w.source === 'local' ? '<span class="tag">직접 추가</span>' : '') + w.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('');

async function viewHome() {

  const queue = newQueue(words).slice(0, s.newPerDay);
  const lastSync = await getMeta('lastSync', null);
  const msg = state.syncMsg;
  const todo = Math.min(c.due, s.reviewLimit) + Math.min(c.new, s.newPerDay);
  return `
    <div class="hero">
      <img src="${CHARACTER_IMG}" alt="정은 캐릭터">
      <div class="msg">
        <b>정은, 오늘도 힘내요!</b>
        <span class="muted">${todo ? `오늘 공부할 단어가 ${todo}개 있어요.` : '오늘 할 공부를 모두 끝냈어요.'}</span>
      </div>
    </div>
    <h2>오늘</h2>
    <div class="stats">
      <button class="stat s-new" data-go-status="new"><span>새 단어</span><b>${c.new}</b><small>오늘 ${Math.min(c.new, s.newPerDay)}개 학습 예정</small></button>
      <button class="stat s-learning" data-go-status="learning"><span>학습 중</span><b>${c.learning}</b><small>통과하면 복습으로</small></button>
      <button class="stat s-review" data-go-status="review"><span>복습</span><b>${c.review}</b><small>오늘 복습 ${Math.min(c.due, s.reviewLimit)}개</small></button>
      <button class="stat s-suspended" data-go-status="suspended"><span>보류</span><b>${c.suspended}</b><small>이미 앎, 제외</small></button>
    </div>
    <div class="card row" style="margin-top:12px">
      <button class="btn primary" disabled>퀴즈 시작</button>
      <span class="muted">퀴즈는 다음 단계에서 추가됩니다.</span>
    </div>

    <h2>다음에 배울 새 단어</h2>
    <div class="card">
      ${queue.length ? `<ol class="queue">${queue.map(w => `
        <li><span class="jp" style="font-size:17px">${esc(w.kanji || w.reading)}</span>
        ${w.kanji ? `<span class="muted jp">${esc(w.reading)}</span>` : ''}
        <span>${esc(w.meanings.join(', '))}</span>${tagsHtml(w)}</li>`).join('')}</ol>
        <p class="muted" style="margin:10px 0 0">직접 추가한 단어가 먼저 나오고, 그다음 N5 목록 순서로 나옵니다.</p>`
      : '<p class="muted" style="margin:0">새 단어가 없습니다. 단어를 받거나 직접 추가하세요.</p>'}
    </div>

    <h2>단어 받기</h2>
    <div class="card">
      <div class="row">
        <button class="btn" data-act="sync">GitHub에서 단어 받기</button>
        <span class="muted">마지막 동기화: ${fmtTime(lastSync)}</span>
      </div>
      ${msg ? `<p class="notice ${msg.err ? 'err' : ''}" style="margin:12px 0 0">${esc(msg.text)}</p>` : ''}
    </div>`;
}

function wordItem(w) {
  const st = w.p.status;
  const ex = w.example ? `<div class="ex"><span class="jp">${esc(w.example.jp)}</span> ${esc(w.example.ko || '')}</div>` : '';
  const actions = [st === 'suspended'
    ? `<button class="btn small" data-act="unsuspend" data-id="${esc(w.id)}">보류 해제</button>`
    : `<button class="btn small" data-act="suspend" data-id="${esc(w.id)}">이미 앎</button>`];
  if (w.source === 'local') {
    actions.push(`<button class="btn small" data-act="edit" data-id="${esc(w.id)}">수정</button>`);
    actions.push(`<button class="btn small danger" data-act="delete" data-id="${esc(w.id)}">삭제</button>`);
  }
  const due = st === 'review' && w.p.due ? `<span class="muted" style="font-size:12px">다음 복습 ${esc(w.p.due)}</span>` : '';
  return `
    <div class="card word">
      <div>
        <div><span class="head jp">${esc(w.kanji || w.reading)}</span>${w.kanji ? `<span class="reading jp">${esc(w.reading)}</span>` : ''}</div>
        <div class="mean">${esc(w.meanings.join(', '))} ${w.pos ? `<span class="muted" style="font-size:13px">${esc(w.pos)}</span>` : ''}</div>
        ${ex}
        <div class="row" style="margin-top:4px">${tagsHtml(w)}</div>
      </div>
      <div class="side">
        <span class="badge b-${st}">${STATUS[st]}</span>
        ${due}
        <div class="row" style="justify-content:flex-end">${actions.join('')}</div>
      </div>
    </div>`;
}

async function viewWords() {
  const words = await loadAll();
  const tags = [...new Set(words.flatMap(w => w.tags))].sort();
  const c = countStatus(words);
  const f = state.filter;
  return `
    <h2>단어장 <span class="muted">${words.length}개</span></h2>
    <div class="row" style="margin-bottom:12px">
      <input id="f-q" type="search" placeholder="한자, 읽기, 뜻 검색" value="${esc(f.q)}" style="flex:1;min-width:180px">
      <select id="f-status">
        <option value="all">전체 상태</option>
        ${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${f.status === k ? 'selected' : ''}>${v} (${c[k]})</option>`).join('')}
      </select>
      <select id="f-tag">
        <option value="all">전체 태그</option>
        <option value="__local" ${f.tag === '__local' ? 'selected' : ''}>직접 추가</option>
        ${tags.map(t => `<option value="${esc(t)}" ${f.tag === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}
      </select>
    </div>
    <div id="word-list" class="list"></div>`;
}
async function renderWordList() {
  const box = $('#word-list');
  if (!box) return;
  const words = await loadAll();
  const f = state.filter, q = f.q.trim().toLowerCase();
  const order = { learning: 0, review: 1, new: 2, suspended: 3 };
  const list = words.filter(w =>
    (f.status === 'all' || w.p.status === f.status) &&
    (f.tag === 'all' || (f.tag === '__local' ? w.source === 'local' : w.tags.includes(f.tag))) &&
    (!q || [w.kanji, w.reading, ...w.meanings].some(x => String(x).toLowerCase().includes(q)))
  ).sort((a, b) => (order[a.p.status] - order[b.p.status]) || (isCustom(b) - isCustom(a)) || (a.rank - b.rank));
  box.innerHTML = list.length ? list.map(wordItem).join('') : '<p class="muted">조건에 맞는 단어가 없습니다.</p>';
}
function bindWordFilters() {
  $('#f-q').addEventListener('input', e => { state.filter.q = e.target.value; renderWordList(); });
  $('#f-status').addEventListener('change', e => { state.filter.status = e.target.value; renderWordList(); });
  $('#f-tag').addEventListener('change', e => { state.filter.tag = e.target.value; renderWordList(); });
  renderWordList();
}

async function viewAdd() {
  const editing = state.editId ? await getOne('words', state.editId) : null;
  const e = editing || {};
  return `
    <h2>${editing ? '단어 수정' : '단어 하나 추가'}</h2>
    <form class="card" id="form-one" style="display:grid;gap:12px">
      <div class="grid2">
        <label class="field">한자 표기 (없으면 비움)<input name="kanji" class="jp" value="${esc(e.kanji)}" placeholder="勉強"></label>
        <label class="field">읽기 (히라가나) *<input name="reading" class="jp" required value="${esc(e.reading)}" placeholder="べんきょう"></label>
        <label class="field">한국어 뜻 * (쉼표로 여러 개)<input name="meanings" required value="${esc((e.meanings || []).join(', '))}" placeholder="공부, 학습"></label>
        <label class="field">품사<input name="pos" value="${esc(e.pos)}" placeholder="명사"></label>
        <label class="field">예문 (일본어)<input name="exjp" class="jp" value="${esc(e.example?.jp)}"></label>
        <label class="field">예문 해석<input name="exko" value="${esc(e.example?.ko)}"></label>
        <label class="field">태그 (쉼표로 여러 개)<input name="tags" value="${esc((e.tags || []).join(', '))}" placeholder="교재 3과"></label>
      </div>
      <div class="row">
        <button class="btn primary" type="submit">${editing ? '저장' : '추가'}</button>
        ${editing ? '<button class="btn" type="button" data-act="cancel-edit">취소</button>' : ''}
      </div>
    </form>
    ${editing ? '' : `
    <h2>스프레드시트에서 붙여넣기</h2>
    <div class="card" style="display:grid;gap:10px">
      <p class="muted" style="margin:0">열 순서는 한자, 읽기, 뜻, 예문, 예문 해석, 태그입니다. 스프레드시트에서 복사하면 칸이 탭으로 구분되어 들어옵니다. 뜻이 여러 개면 한 칸 안에 쉼표로 적으세요.</p>
      <textarea id="bulk" class="jp" placeholder="勉強&#9;べんきょう&#9;공부, 학습&#9;毎日勉強します。&#9;매일 공부합니다.&#9;교재 3과"></textarea>
      <div class="row"><button class="btn" data-act="bulk-preview">미리보기</button></div>
      <div id="bulk-result"></div>
    </div>`}
    <p class="muted">직접 추가한 단어는 이 컴퓨터에만 저장되고, 새 단어 중에서 가장 먼저 학습합니다.</p>`;
}

function localWord({ kanji, reading, meanings, pos, exjp, exko, tags }) {
  const w = normalizeWord({
    kanji, reading, meanings: splitList(meanings), pos,
    example: exjp ? { jp: exjp, ko: exko || '' } : null,
    tags: splitList(tags), source: 'local',
  }, null);
  if (w) w.id = 'local-' + makeKey(w.kanji, w.reading);
  return w;
}
function parseBulk(text) {
  const rows = [];
  for (const line of text.split(/\r?\n/)) {
    if (!line.trim()) continue;
    // 탭이 있으면 스프레드시트 복사본, 없으면 쉼표 구분 (이때 뜻은 한 개만)
    const cols = line.includes('\t') ? line.split('\t') : line.split(',');
    const [kanji, reading, meanings, exjp, exko, tags] = cols.map(c => (c || '').trim());
    if (/^(한자|漢字|kanji)$/i.test(kanji) || /^(읽기|よみ|reading)$/i.test(reading)) continue; // 머리글 줄
    const w = localWord({ kanji, reading, meanings, exjp, exko, tags });
    rows.push(w ? { ok: true, w } : { ok: false, line });
  }
  return rows;
}
async function saveLocalWords(list, { replace = false } = {}) {
  const all = await getAll('words');
  const existing = new Map(all.map(x => [x.id, x]));
  const progressIds = new Set((await getAll('progress')).map(p => p.wordId));
  const repoKeys = new Set(all.filter(x => !x.removed && x.source !== 'local').map(x => makeKey(x.kanji, x.reading)));
  const seen = new Set();
  let added = 0, dup = 0;
  const puts = [], prog = [];
  for (const w of list) {
    const key = makeKey(w.kanji, w.reading);
    if (repoKeys.has(key) || seen.has(w.id) || (existing.has(w.id) && !replace)) { dup++; continue; }
    seen.add(w.id);
    if (existing.has(w.id)) w.addedAt = existing.get(w.id).addedAt;
    puts.push(w); added++;
    if (!progressIds.has(w.id)) prog.push(newProgress(w.id));
  }
  await putMany('words', puts);
  await putMany('progress', prog);
  return { added, dup };
}

async function viewSettings() {
  const s = await getSettings();
  return `
    <h2>학습 설정</h2>
    <form class="card" id="form-settings" style="display:grid;gap:12px">
      <div class="grid2">
        <label class="field">하루 새 단어 수<input name="newPerDay" type="number" min="1" max="100" value="${s.newPerDay}"></label>
        <label class="field">하루 복습 상한<input name="reviewLimit" type="number" min="1" max="500" value="${s.reviewLimit}"></label>
      </div>
      <label class="field">단어 주소 (비우면 기본값)<input name="remoteBase" value="${esc(s.remoteBase)}" placeholder="${esc(autoBase())}"></label>
      <div class="row"><button class="btn primary" type="submit">저장</button></div>
    </form>

    <h2>백업</h2>
    <div class="card" style="display:grid;gap:10px">
      <p class="muted" style="margin:0">학습 진도와 직접 추가한 단어는 이 브라우저에만 저장됩니다. 브라우저 기록을 지우면 사라지니 가끔 백업 파일을 받아두세요.</p>
      <div class="row">
        <button class="btn" data-act="export">백업 파일 받기</button>
        <label class="btn">백업 불러오기<input type="file" id="import-file" accept="application/json,.json" hidden></label>
      </div>
    </div>

    <h2>동기화 문제 해결</h2>
    <div class="card row">
      <button class="btn" data-act="force-sync">단어 전체 다시 받기</button>
      <span class="muted">학습 진도는 그대로 유지됩니다.</span>
    </div>`;
}

// ---------- 이벤트 ----------
document.addEventListener('click', async ev => {
  const nav = ev.target.closest('#nav button');
  if (nav) { state.editId = null; return go(nav.dataset.view); }
  const stat = ev.target.closest('[data-go-status]');
  if (stat) return go('words', { status: stat.dataset.goStatus, q: '', tag: 'all' });
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  try {
    if (act === 'sync' || act === 'force-sync') {
      el.disabled = true;
      await doSync(act === 'force-sync');
      if (act === 'sync') await render();
      else { toast(state.syncMsg.text); el.disabled = false; }
    } else if (act === 'suspend' || act === 'unsuspend') {
      const p = (await getOne('progress', id)) || newProgress(id);
      if (act === 'suspend') { p.prevStatus = p.status; p.status = 'suspended'; }
      else { p.status = p.prevStatus && p.prevStatus !== 'suspended' ? p.prevStatus : 'new'; p.prevStatus = null; }
      p.updatedAt = Date.now();
      await putMany('progress', [p]);
      await renderWordList();
    } else if (act === 'edit') {
      state.editId = id; await go('add');
    } else if (act === 'cancel-edit') {
      state.editId = null; await go('words');
    } else if (act === 'delete') {
      const w = await getOne('words', id);
      if (!confirm(`"${w.kanji || w.reading}" 단어와 학습 기록을 삭제할까요?`)) return;
      await delOne('words', id); await delOne('progress', id);
      toast('삭제했습니다.'); await renderWordList();
    } else if (act === 'bulk-preview') {
      const rows = parseBulk($('#bulk').value);
      state.bulk = rows.filter(r => r.ok).map(r => r.w);
      const bad = rows.filter(r => !r.ok);
      $('#bulk-result').innerHTML = rows.length ? `
        <div class="scroll"><table class="preview">
          <tr><th>한자</th><th>읽기</th><th>뜻</th><th>예문</th><th>태그</th></tr>
          ${state.bulk.map(w => `<tr><td class="jp">${esc(w.kanji)}</td><td class="jp">${esc(w.reading)}</td><td>${esc(w.meanings.join(', '))}</td><td class="jp">${esc(w.example?.jp)}</td><td>${esc(w.tags.join(', '))}</td></tr>`).join('')}
        </table></div>
        ${bad.length ? `<p class="notice err">읽기나 뜻이 비어서 건너뛸 줄 ${bad.length}개: ${bad.map(b => esc(b.line)).join(' / ')}</p>` : ''}
        <div class="row" style="margin-top:10px"><button class="btn primary" data-act="bulk-save" ${state.bulk.length ? '' : 'disabled'}>${state.bulk.length}개 추가</button></div>`
        : '<p class="muted">붙여넣은 내용이 없습니다.</p>';
    } else if (act === 'bulk-save') {
      const r = await saveLocalWords(state.bulk || []);
      state.bulk = null;
      toast(`${r.added}개 추가했습니다.${r.dup ? ` 이미 있는 단어 ${r.dup}개는 건너뛰었습니다.` : ''}`);
      await go('words', { status: 'all', tag: '__local', q: '' });
    } else if (act === 'export') {
      const data = {
        app: 'WordForJungeun', version: 1, exportedAt: new Date().toISOString(),
        settings: await getSettings(),
        localWords: (await getAll('words')).filter(w => w.source === 'local'),
        progress: await getAll('progress'),
      };
      download(`단어장-백업-${todayStr()}.json`, JSON.stringify(data, null, 2));
    }
  } catch (err) {
    console.error(err); toast(err.message || String(err));
  }
});

document.addEventListener('submit', async ev => {
  ev.preventDefault();
  const fd = Object.fromEntries(new FormData(ev.target));
  try {
    if (ev.target.id === 'form-one') {
      const w = localWord(fd);
      if (!w) return toast('읽기와 뜻을 입력하세요.');
      if (state.editId) {
        const repoHit = (await getAll('words')).some(x => !x.removed && x.source !== 'local' && makeKey(x.kanji, x.reading) === makeKey(w.kanji, w.reading));
        if (repoHit) return toast('N5 목록에 이미 있는 단어입니다.');
        if (state.editId !== w.id) {
          if (await getOne('words', w.id)) return toast('같은 표기와 읽기의 단어가 이미 있습니다.');
          const old = await getOne('progress', state.editId);
          await delOne('words', state.editId); await delOne('progress', state.editId);
          if (old) await putMany('progress', [{ ...old, wordId: w.id }]);
        }
        await saveLocalWords([w], { replace: true });
        state.editId = null; toast('저장했습니다.');
        return go('words');
      }
      const r = await saveLocalWords([w]);
      toast(r.added ? `"${w.kanji || w.reading}" 추가했습니다.` : '이미 있는 단어입니다.');
      if (r.added) ev.target.reset();
    } else if (ev.target.id === 'form-settings') {
      const s = { remoteBase: fd.remoteBase.trim(), newPerDay: Math.max(1, +fd.newPerDay || 10), reviewLimit: Math.max(1, +fd.reviewLimit || 30) };
      await setMeta('settings', s);
      toast('설정을 저장했습니다.');
    }
  } catch (err) { console.error(err); toast(err.message || String(err)); }
});

document.addEventListener('change', async ev => {
  if (ev.target.id !== 'import-file' || !ev.target.files[0]) return;
  try {
    const data = JSON.parse(await ev.target.files[0].text());
    if (data.app !== 'WordForJungeun') throw new Error('이 앱의 백업 파일이 아닙니다.');
    if (!confirm(`${(data.exportedAt || '').slice(0, 10)} 백업을 불러올까요? 같은 단어의 진도는 백업 내용으로 바뀝니다.`)) return;
    await putMany('words', data.localWords || []);
    await putMany('progress', data.progress || []);
    if (data.settings) await setMeta('settings', data.settings);
    toast(`불러왔습니다. 진도 ${(data.progress || []).length}개`);
    await render();
  } catch (err) { toast(err.message || '백업 파일을 읽지 못했습니다.'); }
  finally { ev.target.value = ''; }
});

async function doSync(force) {
  try {
    const r = await sync({ force });
    const parts = [];
    if (r.added) parts.push(`새 단어 ${r.added}개`);
    if (r.removed) parts.push(`저장소에서 빠진 단어 ${r.removed}개 숨김`);
    if (r.invalid) parts.push(`형식 오류 ${r.invalid}개 건너뜀`);
    state.syncMsg = { text: !r.files ? '이미 최신 단어입니다.' : parts.length ? parts.join(', ') + ' 반영했습니다.' : '바뀐 단어가 없습니다.' };
  } catch (err) {
    state.syncMsg = { text: err.message, err: true };
  }
}

(async function init() {
  render(); // 저장된 단어로 먼저 표시
  await doSync(false);
  await render();
})();
</script>
